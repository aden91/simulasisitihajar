<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulator RSI Siti Hajar Sidoarjo</title>
<style>
:root{--bg:#e8efe9;--sf:#fff;--tx:#1b2a22;--mu:#5d6f64;--gr:#007F2D;--cd:#f2f7f3;--ln:#d5e0d8;--fr:#14201a;--wb:#e9e3d8;--wm:#d9fdd3;--wo:#fff;--wa:#075e54;--wn:#fff3cd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1612;--sf:#17211b;--tx:#e6efe9;--mu:#9bb0a4;--gr:#3fbf86;--cd:#1e2b24;--ln:#2c3d34;--fr:#000;--wb:#0b141a;--wm:#144d37;--wo:#202c33;--wa:#1f2c34;--wn:#4a3f14}}
:root[data-theme="dark"]{--bg:#0e1612;--sf:#17211b;--tx:#e6efe9;--mu:#9bb0a4;--gr:#3fbf86;--cd:#1e2b24;--ln:#2c3d34;--fr:#000;--wb:#0b141a;--wm:#144d37;--wo:#202c33;--wa:#1f2c34;--wn:#4a3f14}
*{box-sizing:border-box}
html,body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
body{padding:14px;display:flex;flex-wrap:wrap;gap:18px;justify-content:center;align-items:flex-start}
.phone{width:100%;max-width:340px;height:660px;background:var(--fr);border-radius:38px;padding:10px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.sc{background:var(--sf);border-radius:28px;height:100%;display:flex;flex-direction:column;overflow:hidden;position:relative}
.stt{display:flex;justify-content:space-between;padding:8px 18px 4px;font-size:11px;background:var(--gr);color:#fff}
.bar{background:var(--gr);color:#fff;padding:6px 16px 12px;font-weight:600;font-size:15px}
.wa .stt,.wa .bar{background:var(--wa)}
.ct{flex:1;overflow-y:auto;padding:14px}
.nv{display:flex;border-top:1px solid var(--ln)}
.nv button{flex:1;border:0;background:none;padding:8px 0 10px;font-size:10px;color:var(--mu);cursor:pointer}
.nv button span{display:block;font-size:19px}.nv .on{color:var(--gr);font-weight:700}
.hero{background:var(--gr);color:#fff;border-radius:14px;padding:16px}.hero b{display:block;font-size:18px;margin:2px 0 10px}
.btn{border:0;border-radius:20px;background:var(--gr);color:#fff;padding:10px 16px;font-size:13px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.hero .btn{background:#fff;color:#0b7a4b}
h3{font-size:14px;margin:12px 0 8px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:10px;padding:11px;margin-bottom:7px;font-size:13px;cursor:pointer}
.prog{height:5px;background:var(--ln);border-radius:5px;overflow:hidden}.prog i{display:block;height:100%;background:var(--gr)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}.chip{font-size:10px;background:var(--cd);border:1px solid var(--ln);border-radius:10px;padding:2px 8px}
input[type=text]{width:100%;padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--sf);color:var(--tx);font-size:13px;margin-bottom:8px}
.tk{background:var(--gr);color:#fff;border-radius:14px;padding:14px;text-align:center}
.tk .no{font-size:34px;font-weight:800;letter-spacing:1px}.tk div{font-size:12px}
.st{display:inline-block;margin-top:8px;background:#fff;color:#0b7a4b;border-radius:10px;padding:3px 10px;font-size:11px;font-weight:700}
.lv{background:var(--cd);border-radius:12px;padding:12px;margin-top:10px;font-size:12px}
.dots{display:flex;gap:4px;margin-top:8px}.dots i{flex:1;height:6px;border-radius:3px;background:var(--ln)}.dots i.f{background:var(--gr)}
.nt{background:var(--cd);border-radius:10px;padding:10px;margin-bottom:8px;font-size:12px;line-height:1.4}
.toast{position:absolute;top:36px;left:10px;right:10px;background:var(--sf);color:var(--tx);border:1px solid var(--gr);border-radius:12px;padding:10px;font-size:11px;box-shadow:0 6px 20px rgba(0,0,0,.3);cursor:pointer;z-index:5}
.chat{background:var(--wb);flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.bb{max-width:84%;padding:7px 10px;border-radius:10px;font-size:12px;line-height:1.4;background:var(--wo);align-self:flex-start;white-space:pre-wrap}
.bb.me{background:var(--wm);align-self:flex-end}.bb.n{background:var(--wn)}
.wb{display:block;width:84%;text-align:center;border:1px solid var(--ln);background:var(--wo);color:#0b7a4b;border-radius:10px;padding:8px;font-size:12px;cursor:pointer}
.cmp{display:flex;gap:6px;padding:8px;background:var(--cd)}.cmp input{margin:0;flex:1;border-radius:20px}
.panel{width:100%;max-width:340px;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px}
.panel h2{font-size:15px;margin:0 0 4px}.panel p{font-size:12px;color:var(--mu);margin:0 0 10px}
.seg{display:flex;border:1px solid var(--gr);border-radius:20px;overflow:hidden;margin-bottom:12px}
.seg button{flex:1;border:0;padding:8px;background:none;color:var(--gr);cursor:pointer;font-size:13px}.seg .on{background:var(--gr);color:#fff}
.panel .btn{display:block;width:100%;margin-bottom:8px}
.panel .warn{background:#c0392b}.panel .ghost{background:none;color:var(--mu);border:1px solid var(--ln)}
.qr{display:grid;grid-template-columns:repeat(21,1fr);width:156px;margin:4px auto 10px;background:#fff;padding:6px;border-radius:8px}.qr i{aspect-ratio:1}.qr i.k{background:#000}
.ap{--or:#FF6200}.ap .tk{display:none}.ap .sb{display:flex;justify-content:space-between;padding:8px 18px 0;font-size:11px;background:var(--sf)}.ap .sb.g{background:var(--gr);color:#fff;padding-bottom:4px}
.ap .top{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--sf)}.ap .logo{flex:1;font-weight:800;font-size:15px;color:var(--gr);line-height:1}.ap .logo small{display:block;color:var(--or);font-size:9px;letter-spacing:2px}
.ap .igd{background:var(--or);color:#fff;border:0;border-radius:14px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer}.ap .ib{width:32px;height:32px;border-radius:50%;border:0;background:var(--cd);display:grid;place-items:center;position:relative;cursor:pointer;font-size:15px}.ap .dot{position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;background:var(--or)}
.ap .hd{display:flex;align-items:center;gap:10px;padding:8px 14px 12px;background:var(--gr);color:#fff;font-weight:700;font-size:15px}.ap .hd button{background:none;border:0;color:#fff;font-size:24px;line-height:1;cursor:pointer}
.ap .hi{font-size:16px;margin:2px 0 10px}.ap .hi b{color:var(--gr)}.ap .menu{display:flex;background:var(--sf);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.14);padding:12px 4px}.ap .mi{flex:1;background:none;border:0;color:var(--tx);font-size:10px;cursor:pointer}.ap .mi i{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;margin:0 auto 4px;font-style:normal;font-size:21px;background:color-mix(in srgb,var(--gr) 14%,transparent)}
.ap .mon{margin-top:12px;background:var(--gr);color:#fff;border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;cursor:pointer;font-size:11px;border-left:5px solid var(--or)}.ap .mon b{display:block;font-size:14px}
.ap .sec{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px;font-size:14px;font-weight:700}.ap .sec a{color:var(--or);font-size:12px;cursor:pointer}
.ap .pc{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.ap .pc button{flex:none;border:1px solid var(--ln);background:none;color:var(--mu);border-radius:16px;padding:6px 14px;font-size:12px;cursor:pointer}.ap .pc .on{background:var(--or);color:#fff;border-color:transparent}
.ap .cd{background:var(--sf);border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.14);padding:12px;margin-bottom:10px;font-size:12px}.ap .cd small{color:var(--mu);display:block;margin-top:2px}.ap .big{font-size:21px;font-weight:800;letter-spacing:.5px}.ap .lk{display:flex;justify-content:space-between;margin-top:10px;color:var(--gr);font-weight:700;font-size:12px}.ap .lk span{cursor:pointer}
.ap .bd{float:right;font-size:10px;font-weight:700;border-radius:8px;padding:3px 8px;background:color-mix(in srgb,var(--gr) 16%,transparent);color:var(--gr)}.ap .bd.o{background:color-mix(in srgb,#FF6200 18%,transparent);color:#FF6200}
.ap .promo{background:linear-gradient(120deg,#FF6200,#ff9a4d);border-radius:12px;color:#fff;padding:14px;font-size:12px}.ap .promo b{font-size:16px;display:block;margin-bottom:2px}.ap .empty{background:var(--gr);color:#fff;border-radius:12px;padding:14px;font-size:12px}.ap .empty b{display:block;font-size:14px;margin-bottom:3px}
.ap .btn{width:100%;border-radius:8px;padding:12px;font-weight:700;margin-bottom:8px}.ap .btn.ol{background:none;border:1.5px solid var(--gr);color:var(--gr)}.ap .btn.tx{background:none;color:var(--gr)}.ap .btn:disabled{background:var(--ln);color:var(--mu)}
.ap .opt{background:var(--sf);border-radius:10px;padding:12px;border-left:4px solid var(--gr)}.ap input[type=text],.ap input[type=date],.ap select{width:100%;border:0;border-bottom:1px solid var(--ln);border-radius:0;padding:8px 0;margin-bottom:12px;background:none;color:var(--tx);font-size:13px}.ap label{display:block;font-size:11px;color:var(--mu)}
.ap .tbs{display:flex;border-bottom:1px solid var(--ln);margin-bottom:10px}.ap .tbs button{flex:1;border:0;background:none;padding:10px 0;font-size:11px;font-weight:700;color:var(--mu);cursor:pointer}.ap .tbs .on{color:var(--gr);box-shadow:inset 0 -3px 0 var(--or)}.ap .nv .on{box-shadow:inset 0 3px 0 var(--or)}
.ap .info{border:1px solid var(--gr);color:var(--gr);border-radius:8px;padding:10px;font-size:11px;margin-bottom:10px;line-height:1.5}.ap .rw{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--ln);font-size:12px}.ap .rw b.or{color:var(--or);font-size:14px}
.ap .li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln);font-size:13px;cursor:pointer}.ap .li small{display:block;color:var(--mu);font-size:11px}.ap .up{border:1.5px dashed var(--ln);border-radius:10px;padding:26px;text-align:center;color:var(--gr);font-size:12px;font-weight:700}.ap .sq .qr{width:84px;margin:0;padding:3px}
.ap .ok{background:var(--gr);color:#fff;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:10px}.ap .ok .ck{width:84px;height:84px;border-radius:50%;background:#fff;color:var(--gr);display:grid;place-items:center;font-size:44px}.ap .ok .btn{background:#fff;color:var(--gr)}.ap .ok .btn.tx{background:none;color:#fff}
.stat{font-size:12px;background:var(--cd);border-radius:10px;padding:10px;margin-bottom:10px}
.ap .lg{height:32px;display:block;background:#fff;border-radius:6px;padding:2px 4px}.wa .em{height:26px;vertical-align:middle;margin-right:6px;background:#fff;border-radius:6px;padding:1px}</style>
</head>

 if(s=="dokter")return p.d.map(x=>[x+" · "+(slots(x,p.k)[0]||"jadwal belum tersedia"),x]);
 if(s=="jam")return slots(S.d.dokter,P.find(x=>x.n==S.d.poli).k).map(x=>[x,x]);
 if(s=="rm")return[["Pasien lama (sudah punya No. RM)","lama"],["Pasien baru (buat No. RM baru)","baru"]];
 if(s=="jamin")return[["Umum / pribadi","Umum"],["BPJS Kesehatan","BPJS"]];
 if(s=='bayar')return['QRIS','Virtual Account','Transfer Bank','E-Wallet'].map(x=>[x,x]);
 if(s=='rujukan')return[['✅ Rujukan FKTP aktif (berlaku)','ok'],['⛔ Rujukan kedaluwarsa / belum ada','exp']];
 if(s=='pay')return[['✅ Simulasi: saya sudah bayar','ok'],['⏱️ Simulasi: pembayaran kedaluwarsa','exp']];

  S.step='bayar';bot('⏱️ Pembayaran kedaluwarsa. Nomor antrean belum diterbitkan. Silakan pilih metode pembayaran lagi.');ask();return render()}
 if(S.step=='rujukan'){if(v=='exp'){S.step='jamin';bot('❌ Rujukan tidak berlaku. Silakan minta rujukan baru di FKTP (puskesmas/klinik) atau daftar sebagai pasien umum.');ask();return render()}return finish()}

 S.step=ST[ST.indexOf(S.step)+1];ask();render()}

  if(on===null){s=(s*1103515245+12345)&0x7fffffff;on=(s>>8)&1}h+=`<i class="${on?'k':''}"></i>`}return h+'</div>'}

function slots(nm,pk){let sg=[],o=[];jdl(JD.r).forEach(g=>g.d.forEach(y=>{if(g.p==pk&&y[0]==nm&&y[1]!='CUTI')sg=sg.concat(y[1].split(';'))}));
 for(let k=0;k<35&&o.length<2;k++){const d=new Date();d.setDate(d.getDate()+k);const m=sg.filter(r=>onDay(r.slice(0,r.lastIndexOf(' ')),(d.getDay()+6)%7,Math.ceil(d.getDate()/7)));
  if(m.length)o.push((k==0?'Hari ini':k==1?'Besok':d.toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short'}))+', '+m.map(r=>r.slice(r.lastIndexOf(' ')+1).replace(/-/g,'–')).join(' & '))}
 return o}
function jad(){const k=S.jt||0,q=(S.jq||'').toLowerCase(),dy=S.jd===undefined?td():S.jd;let wk=1,dl='',n=0;
 if(dy>=0){const d=new Date();d.setDate(d.getDate()+(dy-td()+7)%7);wk=Math.ceil(d.getDate()/7);dl=d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'})}
 const h=jdl(k?JD.e:JD.r).map(g=>({p:g.p,d:g.d.map(x=>{const cu=x[1]=='CUTI';return[x[0],x[1],cu?[]:x[1].split(';').filter(r=>dy<0||onDay(r.slice(0,r.lastIndexOf(' ')),dy,wk)),cu]}).filter(x=>(x[0]+g.p).toLowerCase().includes(q)&&(dy<0||x[2].length))})).filter(g=>g.d.length).map(g=>`<div class='sec' style='margin:12px 0 6px'>${esc(g.p)}</div>`+g.d.map(x=>{n++;return `<div class='cd'><b>${esc(x[0])}</b>${x[3]?`<span class='bd o'>CUTI</span>`:x[2].map(r=>{const i=r.lastIndexOf(' ');return `<div class='rw'><span>${esc(r.slice(0,i).split(',').join(', '))}</span><b>${r.slice(i+1)} WIB</b></div>`}).join('')}${x[3]?'':k?`<button class='btn ol' style='margin:8px 0 0;padding:8px' data-ts='Klinik Eksekutif: daftar via WA 0813-3100-0215 / 0822-4583-3500'>Daftar via WhatsApp</button>`:P.some(p=>p.k==g.p&&p.d.includes(x[0]))?`<button class='btn ol' style='margin:8px 0 0;padding:8px' data-dk='${esc(g.p+'|'+x[0])}'>Daftar Janji Temu</button>`:''}</div>`}).join('')).join('');
 return `<div class='tbs'>${['Praktik Dokter','Klinik Eksekutif'].map((x,i)=>`<button class='${i==k?'on':''}' data-jt='${i}'>${x}</button>`).join('')}</div><input type='text' id='jq' placeholder='🔍 Cari dokter / poli' value='${esc(S.jq||'')}'>
 <div class='chips' style='margin:0 0 8px'>${['Semua',...DN].map((x,i)=>{const v=i-1;return `<span class='chip' data-jd='${v}' style='cursor:pointer;padding:5px 9px;font-size:11px;${v==dy?'background:var(--gr);color:#fff;border-color:var(--gr)':''}'>${x}${v==td()?' •':''}</span>`}).join('')}</div>
 <small style='color:var(--mu)'>${dy<0?'Semua hari':'Praktik '+dl} · ${n} dokter</small>${h||`<p style='font-size:12px;color:var(--mu);text-align:center'>Tidak ada dokter praktik pada filter ini.</p>`}<div class='info' style='margin-top:10px'>${k?'Berlaku bagi pasien umum. Pendaftaran melalui WA 0813-3100-0215 / 0822-4583-3500.':'Jika kuota online penuh, daftar langsung pada hari H (konvensional) mulai pukul 06.00 WIB. Klinik BKIA, Umum dan Gigi Umum: pendaftaran via WA Klinik Eksekutif (0813-3100-0215). Jadwal dr. H. Raz Fides Umi Rahmawati, M.Kes., Sp.OG. Subsp Obginsos (K) hari Selasa, Kamis & Sabtu hanya untuk pasien Umum & Asuransi Swasta. Jadwal dapat berubah sewaktu-waktu; hubungi hotline RSI Siti Hajar.'}</div>`}
document.addEventListener('input',e=>{if(e.target.id=='jq'){S.jq=e.target.value;render();const i=document.getElementById('jq');i.focus();i.setSelectionRange(i.value.length,i.value.length)}});
function appView(){let T=S.tab;if(T==1&&S.step=='done')T=6;
 const nc=S.log.filter(x=>x.n).length,dot=nc>(S.sn||0);if(T==2)S.sn=nc;
 if(T==8)return SB(0)+`<div class='ok'><div class='ck'>✓</div><b style='font-size:18px'>Pembatalan janji temu berhasil</b><span style='font-size:12px'>Cek status pembatalan di menu Transaksi Pasien.</span><button class='btn' data-tab='4'>Lihat Status</button><button class='btn tx' data-tab='0'>Kembali ke Beranda</button></div>`;
 const body={0:home,1:flow,2:ntf,3:mon,4:trx,5:acc,6:det,7:prof,9:jad}[T](),sub={9:'Jadwal Dokter',1:'Buat Janji Temu',2:'Notifikasi',6:'Detail Janji Temu',7:'Detail Profil Pasien'}[T];
 const head=sub?SB(1)+`<div class='hd'><button data-tab='${T==6?4:T==7?5:0}'>‹</button>${sub}</div>`:SB(0)+`<div class='top'><div class='logo'><img class='lg' src='${LOGO}' alt='RSI Siti Hajar Sidoarjo'></div><button class='igd' data-ts='IGD 24 jam (simulasi): hubungi nomor darurat RS'>🚑 IGD</button><button class='ib' data-tab='2'>🔔${dot?`<span class='dot'></span>`:''}</button><button class='ib' data-tab='5'>👤</button></div>`;
 return head+(S.toast?`<div class='toast' data-tab='2'>🔔 ${esc(S.toast).split('\n')[0].slice(0,90)}</div>`:'')+`<div class='ct'>${body}</div><div class='nv'>${[['Home','🏠',0],['Antrean','👥',3],['Transaksi','🕘',4],['Akun','👤',5]].map(x=>`<button class='${x[2]==T?'on':''}' data-tab='${x[2]}'><span>${x[1]}</span>${x[0]}</button>`).join('')}</div>`}
function waView(){const o=opts();let last=-1;S.log.forEach((m,i)=>{if(m.step)last=i});
 const msgs=S.log.map((m,i)=>{let h=`<div class="bb ${m.f=="me"?"me":""} ${m.n?"n":""}">${esc(m.t)}</div>`;
  if(m.step&&i==last&&m.step==S.step&&o)h+=o.map(x=>`<button class="wb" data-pk="${esc(x[1])}">${esc(x[0])}</button>`).join("");
  if(m.acts&&!m.done)h+=m.acts.map(a=>`<button class="wb" data-ac="${a[1]}">${a[0]}</button>`).join("");return h}).join("");
 const can=S.step=="nama"||S.step=="hp"||S.step=="rmno";
 return `<div class="stt"><span>9:41</span><span>●●● 5G ▮</span></div><div class="bar"><img class="em" src="${EMB}" alt="">RSI Siti Hajar Sidoarjo ✓<div style="font-size:10px;font-weight:400">Akun resmi · online</div></div>
 <div class="chat" id="chat">${msgs}</div>
 <div class="cmp"><input type="text" id="tx" ${can?"":"disabled"} placeholder="${can?"Ketik pesan…":"Pilih opsi di atas"}"><button class="btn" data-sd="1" ${can?"":"disabled"}>➤</button></div>`}

function panel(){const t=S.tk,w=t&&t.st=="menunggu";
 return `<h2>Panel Simulasi</h2><p>Jalankan skenario dari sisi pasien dan rumah sakit.</p>
 <div class="seg"><button class="${S.ch=="app"?"on":""}" data-ch="app">📱 Aplikasi</button><button class="${S.ch=="wa"?"on":""}" data-ch="wa">💬 WhatsApp</button></div>
 <div class="stat"><b>Status:</b> ${t?`${t.no} · ${SL[t.st]}${t.arr?' · di RS':' · jadwal '+tl(t.mins)+' lagi'}${t.tp.filter(x=>x>t.sv).length?' · '+t.tp.filter(x=>x>t.sv).length+' titipan di depan':''}`:"Belum mendaftar (langkah: "+S.step+")"}</div>
 <button class="btn" data-sim="tick" ${w&&!t.arr&&t.ms.length?'':'disabled'}>⏩ Maju waktu: ${t&&t.ms.length?'H-'+tl(t.ms[0]):'—'}</button>
 <button class="btn" data-sim="arrive" ${w&&!t.arr&&t.mins<=30?'':'disabled'}>📍 Pasien tiba di RS (check-in)</button>
 <button class="btn" data-sim="next" ${w?"":"disabled"}>🔔 Panggil antrean berikutnya</button>
 <button class="btn" data-sim="titip" ${w&&t.n-t.sv-1>=1?'':'disabled'}>🎫 Humas sisipkan pasien titipan</button>
 <button class="btn warn" data-sim="absent" ${w&&t.arr?"":"disabled"}>🚫 Dokter mendadak tidak hadir</button>
 <button class="btn" data-sim="step" ${t&&t.st=='dipanggil'?'':'disabled'}>${!t||t.st!='dipanggil'?'➡️ Tahap kunjungan berikutnya':t.ph=='poli'?'🩺 Dokter selesai periksa (resep)':t.ph=='farmasi'?'💊 Farmasi: obat siap':'✅ Pasien ambil obat (selesai)'}</button>
 <button class="btn ghost" data-sim="reset">↺ Reset simulasi</button>
 <p style="margin:6px 0 0">Alur: daftar → bayar (nomor antrean terbit setelah lunas) → pengingat sebelum jadwal → tiba di RS → titipan Humas (opsional) → dokter absen → pilih solusi. Pendaftaran di aplikasi dan WhatsApp memakai data yang sama; coba pindah saluran di tengah jalan.</p>`}

document.addEventListener('click',e=>{const b=e.target.closest('[data-fm],[data-rf],[data-tt],[data-cn],[data-ts],[data-jt],[data-jd],[data-dk]');if(!b)return;const d=b.dataset;
 if(d.fm!==undefined)S.fm=+d.fm;
 else if(d.rf)S.rf=new Date().toTimeString().slice(0,5);
 else if(d.tt!==undefined)S.tt=+d.tt;
 else if(d.jt!==undefined)S.jt=+d.jt;
 else if(d.jd!==undefined)S.jd=+d.jd;
 else if(d.dk){const[a,b]=d.dk.split('|'),p=P.find(x=>x.k==a);
  if(S.tk||!['poli','dokter','jam','nama','hp','jamin'].includes(S.step)){S.toast=S.tk?'Sudah ada janji aktif. Reset simulasi di panel.':'Selesaikan pendaftaran yang berjalan dulu.';clearTimeout(tt);tt=setTimeout(()=>{S.toast=null;render()},2500)}
  else{S.d={poli:p.n,dokter:b};S.step='jam';S.log.push({f:'me',t:'Daftar: '+b});bot(p.n+' · '+b+' dipilih.');ask();S.tab=1;S.toast=null}}
 else if(d.cn){act('refund');S.tab=8}
 else if(d.ts){S.toast=d.ts;clearTimeout(tt);tt=setTimeout(()=>{S.toast=null;render()},2500)}
 render()});
function render(){const sc=document.getElementById('sc');sc.className='sc '+(S.ch=='wa'?'wa':'ap');
 sc.innerHTML=S.ch=="wa"?waView():appView();document.getElementById("pn").innerHTML=panel();
 const c=document.getElementById("chat");if(c)c.scrollTop=c.scrollHeight}
document.addEventListener("click",e=>{const b=e.target.closest("[data-tab],[data-pk],[data-sd],[data-ac],[data-ch],[data-sim]");if(!b)return;const d=b.dataset;
 if(d.tab!==undefined){S.tab=+d.tab;S.toast=null;render()}
 else if(d.pk!==undefined)pick(d.pk);
 else if(d.sd){const i=document.getElementById("tx");if(i&&i.value.trim())send(i.value)}
 else if(d.ac)act(d.ac);
 else if(d.ch){S.ch=d.ch;render()}
 else if(d.sim=='arrive')arrive();else if(d.sim=='tick')tick();else if(d.sim=="next")next();else if(d.sim=='titip')titip();else if(d.sim=='step')step();else if(d.sim=="absent")absent();else if(d.sim=="reset")init()});
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.id=="tx"&&e.target.value.trim())send(e.target.value)});
init();
</script>
</body>
